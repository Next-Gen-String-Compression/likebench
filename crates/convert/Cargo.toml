[package]
name = "convert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Transcode/compress tool: csv/json/parquet -> canonical Parquet or Vortex. Emits compression metrics."

[[bin]]
name = "convert"
path = "src/main.rs"

[dependencies]
bench-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
arrow = { workspace = true, features = ["csv", "json"] }
parquet.workspace = true
tokio.workspace = true
futures.workspace = true
vortex.workspace = true
vortex-btrblocks.workspace = true
