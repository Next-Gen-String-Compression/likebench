name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Python harness: lint + unit tests (fast, no heavy native deps).
  python:
    name: python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run --extra dev pytest

  # Rust workspace: format, clippy, build, test. Exclude heavy crates (the
  # Vortex tree) with `--workspace --exclude <crate>` as they land in later layers.
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --release -- -D warnings
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      - name: tpch-gen generates a table
        run: ./target/release/tpch-gen --table lineitem --scale 0.01 --output /tmp/li.parquet
