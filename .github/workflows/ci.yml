name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Python harness: lint + unit tests (fast, no heavy native deps).
  python:
    name: python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run --extra dev pytest

  # Light Rust crates: format, clippy, build, test (fast — no Vortex tree).
  rust-light:
    name: rust (core + tpch-gen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p bench-core -p tpch-gen --release -- -D warnings
      - run: cargo build -p bench-core -p tpch-gen --release
      - run: cargo test -p bench-core --release
      - name: tpch-gen generates a table
        run: ./target/release/tpch-gen --table lineitem --scale 0.01 --output /tmp/li.parquet

  # Heavy crates: convert + bench-datafusion pull the DataFusion + Vortex tree.
  rust-engine:
    name: rust (convert + datafusion, heavy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p convert -p bench-datafusion --release

  # End-to-end on generated TPC-H (offline): data -> convert -> mine -> run -> plot.
  e2e:
    name: e2e (tpch nano, offline)
    runs-on: ubuntu-latest
    needs: [rust-light, python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --extra dev
      - name: Build binaries for the pipeline
        run: cargo build -p tpch-gen -p convert -p bench-datafusion --release
      - name: Run pipeline (TPC-H nano)
        run: uv run python run.py --scale nano --warmup 1 --measure 3
      - uses: actions/upload-artifact@v4
        with:
          name: results-tpch-nano
          path: results/
          if-no-files-found: warn
